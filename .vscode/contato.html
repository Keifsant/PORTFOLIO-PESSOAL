    <title>Meu Perfil</title>

    <body>

        <header>

            <div id="header_content">
                <div id="titulo">

                    <h1>Generation Brasil</h1>

                    <div id="menu">

                        <nav>
                            <ul id="menu">
                                >
                                    <a href="index.html"> Home </a>
                                </li>
                                <li>
                                    <a href="contato.html"> Contato </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>

            </div>
        </header>

        <main>

            <section id="contact" class="flex">

                <form action="#" method="submit" id="formulario">
                    <label for="nome">Nome: </label>
					<input
						id="name"
						type="text"
						name="name"
						placeholder="Digite seu nome"
						required
					/>
					<span id="txtNome"></span>

					<label for="email">Email: </label>
					<input
						id="email"
						type="email"
						name="email"
						placeholder="Digite seu email"
						required
					/>
					<span id="txtEmail"></span>

					<label for="subject">Assunto: </label>
					<input
						id="subject"
						type="text"
						name="subject"
						placeholder="Digite o título da mensagem"
                        required
					/>
					<span id="txtSubject"></span>

					<label for="message">Mensagem: </label>
					<textarea
						id="message"
						name="message"
						placeholder="Digite sua mensagem"
						required
					>
					</textarea>

					<button type="submit">Enviar</button>
                    </form>

                    <section id="mapa" class="flex_start">

                        <div id="endereco"> 
                        <p>Av. Paulista, 100</p>
                        <p>São Paulo - SP</p>
                        </div>
                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d467690.14386865456!2d-46.92495573160536!3d-23.682063556622076!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce448183a461d1%3A0x9ba94b08ff335bae!2zU8OjbyBQYXVsbywgU1A!5e0!3m2!1spt-BR!2sbr!4v1743088493127!5m2!1spt-BR!2sbr" 
                            width="400" 
                            height="300" 
                            style="border:0;" 
                            allowfullscreen="" 
                            loading="lazy" 
                            referrerpolicy="no-referrer-when-downgrade"
                            aria-hidden="false"
						tabindex="0"
						id="mapa">
                        </iframe>
                            
                    </section>

                </section>
        </main>

		<footer class="flex">

		
			<section id="redes_sociais">
